# ==============================================================================
# JIBSZ TUNNELING / J1BTNL - NGINX REVERSE PROXY CONFIG (MODE 1: VPS IP PUBLIC)
# Mendengarkan di Port 80 (HTTP/WS) dan Port 443 SSL (HTTP/1.1 ALPN untuk WSS)
# Dilengkapi Penegakan Limit Device IP Real-Time (/etc/jibsz/blocked_ips.map)
# ==============================================================================

map $http_x_forwarded_for $xff_first_ip {
    ~^([^,\s]+) $1;
    default     $remote_addr;
}

map $http_cf_connecting_ip $client_real_ip {
    default $http_cf_connecting_ip;
    ""      $xff_first_ip;
}

map $client_real_ip $is_overlimit_ip {
    default 0;
    include /etc/jibsz/blocked_ips.map;
}

log_format jibsz_realip '$remote_addr - $client_real_ip [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_user_agent" "$http_x_forwarded_for"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name __DOMAIN__ *.__DOMAIN__ _;

    ssl_certificate     /etc/jibsz/ssl/fullchain.pem;
    ssl_certificate_key /etc/jibsz/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    access_log /var/log/jibsz/nginx_access.log jibsz_realip;
    error_log  /var/log/jibsz/nginx_error.log warn;

    client_max_body_size 0;
    keepalive_timeout 86400s;
    keepalive_requests 100000;
    tcp_nodelay on;
    proxy_buffering off;
    proxy_request_buffering off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location = /cdn-cgi/trace {
        if ($is_overlimit_ip = 1) {
            return 403;
        }
        default_type text/plain;
        return 200 "fl=jibsz\nh=$host\nip=$client_real_ip\nvisit_scheme=https\nhttp=http/1.1\nloc=ID\n";
    }

    # 1. SSH WebSocket Proxy (/ssh-ws)
    location ^~ /ssh-ws {
        if ($is_overlimit_ip = 1) {
            return 403;
        }
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10015;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $client_real_ip;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. VLESS gRPC (ServiceName: vless-grpc)
    location ^~ /vless-grpc {
        if ($is_overlimit_ip = 1) {
            return 403;
        }
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $client_real_ip;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. VMess gRPC (ServiceName: vmess-grpc)
    location ^~ /vmess-grpc {
        if ($is_overlimit_ip = 1) {
            return 403;
        }
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $client_real_ip;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. Trojan gRPC (ServiceName: trojan-grpc)
    location ^~ /trojan-grpc {
        if ($is_overlimit_ip = 1) {
            return 403;
        }
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $client_real_ip;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 5. VLESS WebSocket (/vless)
    location ^~ /vless {
        if ($is_overlimit_ip = 1) {
            return 403;
        }
        proxy_redirect off;
        rewrite ^/vless.*$ /vless break;
        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade "websocket";
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $client_real_ip;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 6. VMess WebSocket (/vmess)
    location ^~ /vmess {
        if ($is_overlimit_ip = 1) {
            return 403;
        }
        proxy_redirect off;
        rewrite ^/vmess.*$ /vmess break;
        proxy_pass http://127.0.0.1:10002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade "websocket";
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $client_real_ip;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 7. Trojan WebSocket (/trojan)
    location ^~ /trojan {
        if ($is_overlimit_ip = 1) {
            return 403;
        }
        proxy_redirect off;
        rewrite ^/trojan.*$ /trojan break;
        proxy_pass http://127.0.0.1:10003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade "websocket";
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $client_real_ip;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 8. Root Path / (SSH WS)
    location / {
        if ($is_overlimit_ip = 1) {
            return 403;
        }
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10015;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $client_real_ip;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
