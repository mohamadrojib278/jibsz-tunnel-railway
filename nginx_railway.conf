# ==============================================================================
# JIBSZ TUNNELING / J1BTNL - NGINX CONFIG FOR RAILWAY + CLOUDFLARE TUNNEL
# Cloudflare Tunnel Public Hostname diarahkan ke: http://127.0.0.1:8080
# ==============================================================================

map $http_x_forwarded_for $xff_first_ip {
    ~^([^,\s]+) $1;
    default     $remote_addr;
}

map $http_cf_connecting_ip $client_real_ip {
    default $http_cf_connecting_ip;
    ""      $xff_first_ip;
}

map $client_real_ip $is_overlimit_ip {
    default 0;
    include /etc/jibsz/blocked_ips.map;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Pisahkan trafik WebSocket (SSH-WS) vs HTTP biasa (Web Panel) pada root path /
map $http_upgrade $root_backend {
    ~*websocket 127.0.0.1:10015;
    default     127.0.0.1:8000;
}

log_format jibsz_realip '$remote_addr - $client_real_ip [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen ${PORT} default_server;
    listen [::]:${PORT} default_server;
    server_name _;

    access_log /var/log/jibsz/nginx_access.log jibsz_realip;
    error_log  /var/log/jibsz/nginx_error.log warn;

    client_max_body_size 50m;
    keepalive_timeout 86400s;
    keepalive_requests 100000;
    tcp_nodelay on;
    proxy_buffering off;
    proxy_request_buffering off;

    location = /cdn-cgi/trace {
        if ($is_overlimit_ip = 1) {
            return 403;
        }
        default_type text/plain;
        return 200 "fl=jibsz\nh=$host\nip=$client_real_ip\nvisit_scheme=https\nhttp=http/1.1\nloc=ID\n";
    }

    # 1. SSH WebSocket Proxy (/ssh-ws)
    location ^~ /ssh-ws {
        if ($is_overlimit_ip = 1) {
            return 403;
        }
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10015;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $client_real_ip;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. VLESS gRPC (/vless-grpc)
    location ^~ /vless-grpc {
        if ($is_overlimit_ip = 1) {
            return 403;
        }
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $client_real_ip;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. VMess gRPC (/vmess-grpc)
    location ^~ /vmess-grpc {
        if ($is_overlimit_ip = 1) {
            return 403;
        }
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $client_real_ip;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. Trojan gRPC (/trojan-grpc)
    location ^~ /trojan-grpc {
        if ($is_overlimit_ip = 1) {
            return 403;
        }
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $client_real_ip;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 5. VLESS WebSocket (/vless)
    location ^~ /vless {
        if ($is_overlimit_ip = 1) {
            return 403;
        }
        proxy_redirect off;
        rewrite ^/vless.*$ /vless break;
        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade "websocket";
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $client_real_ip;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 6. VMess WebSocket (/vmess)
    location ^~ /vmess {
        if ($is_overlimit_ip = 1) {
            return 403;
        }
        proxy_redirect off;
        rewrite ^/vmess.*$ /vmess break;
        proxy_pass http://127.0.0.1:10002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade "websocket";
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $client_real_ip;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 7. Trojan WebSocket (/trojan)
    location ^~ /trojan {
        if ($is_overlimit_ip = 1) {
            return 403;
        }
        proxy_redirect off;
        rewrite ^/trojan.*$ /trojan break;
        proxy_pass http://127.0.0.1:10003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade "websocket";
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $client_real_ip;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 8. Root Path / (Web Panel jika HTTP biasa, SSH-WS jika Upgrade: websocket)
    location / {
        proxy_redirect off;
        proxy_pass http://$root_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $client_real_ip;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
