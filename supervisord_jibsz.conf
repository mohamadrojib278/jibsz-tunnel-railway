[program:xray]
command=/usr/local/bin/xray run -config /usr/local/etc/xray/config.json
autostart=true
autorestart=true
stdout_logfile=/var/log/jibsz/supervisor_xray.out.log
stderr_logfile=/var/log/jibsz/supervisor_xray.err.log

[program:dropbear]
command=/usr/sbin/dropbear -F -E -p 127.0.0.1:109 -W 65536
autostart=true
autorestart=true
stdout_logfile=/var/log/jibsz/supervisor_dropbear.out.log
stderr_logfile=/var/log/jibsz/supervisor_dropbear.err.log

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
stdout_logfile=/var/log/jibsz/supervisor_sshd.out.log
stderr_logfile=/var/log/jibsz/supervisor_sshd.err.log

[program:ssh-ws]
command=python3 /app/backend/ssh_ws_proxy.py
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/var/log/jibsz/supervisor_sshws.out.log
stderr_logfile=/var/log/jibsz/supervisor_sshws.err.log

[program:webpanel]
command=uvicorn app:app --host 127.0.0.1 --port 8000 --proxy-headers --forwarded-allow-ips="*"
directory=/app/webpanel
autostart=true
autorestart=true
stdout_logfile=/var/log/jibsz/supervisor_webpanel.out.log
stderr_logfile=/var/log/jibsz/supervisor_webpanel.err.log

[program:cloudflared]
command=/app/run_cloudflared.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/jibsz/supervisor_cloudflared.out.log
stderr_logfile=/var/log/jibsz/supervisor_cloudflared.err.log

[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
stdout_logfile=/var/log/jibsz/supervisor_cron.out.log
stderr_logfile=/var/log/jibsz/supervisor_cron.err.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
